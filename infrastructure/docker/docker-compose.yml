services:
  postgres:
    image: postgres:16-alpine
    container_name: cricketpro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cricketpro
      POSTGRES_PASSWORD: cricketpro
      POSTGRES_DB: cricketpro
    ports:
      - "5432:5432"
    volumes:
      - cricketpro_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cricketpro -d cricketpro"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cricketpro-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - cricketpro_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cricketpro_postgres_data:
  cricketpro_redis_data:
